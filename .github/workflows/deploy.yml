name: Deploy

# Distribution only, to Cloudflare. The deployed application is the same static
# build that runs from a local checkout: no backend, no analytics, no runtime
# API. Once loaded it continues to work with the network off.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web

      - name: Verify the build carries no off-origin reference
        run: |
          # Deployment must not reintroduce a CDN dependency. What is allowed:
          # XML namespace URIs, the site's own absolute URLs in canonical and
          # Open Graph metadata, the repository links on the methods screen,
          # and React's error-decoder URL. Anything else is a resource the
          # page might fetch from a third party.
          if grep -rhoE "https?://[a-zA-Z0-9./_-]+" apps/web/dist/assets apps/web/dist/index.html \
            | sort -u \
            | grep -vE "^https?://(www\.)?w3\.org/" \
            | grep -vE "^https://entropylab\.timjosh507\.workers\.dev/" \
            | grep -vE "^https://github\.com/winsznx/entropylab" \
            | grep -vE "^https://reactjs\.org/docs/error-decoder\.html$" \
            | grep .; then
            echo "Unexpected external reference in the build"
            exit 1
          fi
          echo "No unexpected external references"

      # Publishing from CI needs a Cloudflare API token in repository secrets.
      # Until one is added the build and its guard still run on every push,
      # and releases go out with `pnpm publish:web` from a machine where
      # wrangler is already authenticated.
      - name: Check for Cloudflare credentials
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN secret; skipping publish."
          fi

      - name: Publish to Cloudflare
        if: steps.cf.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
