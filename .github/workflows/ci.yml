name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and regression tests
        run: pnpm test

      - name: Build the application
        run: pnpm build:web

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Verify the proof campaign regenerates identically
        run: |
          pnpm campaign
          if ! git diff --quiet -- docs/proof-campaign; then
            echo "docs/proof-campaign differs from a fresh run; regenerate with 'pnpm campaign'"
            git diff --stat -- docs/proof-campaign
            exit 1
          fi
          echo "Published campaign results match a fresh run"

      - name: Verify internal material is not tracked
        run: |
          if git ls-files --error-unmatch internal/ >/dev/null 2>&1; then
            echo "internal/ is tracked; private planning material must stay local"
            exit 1
          fi
          echo "internal/ is untracked, as expected"

      - name: Verify no physical calibration data was fabricated
        run: |
          if ls data/physical/physical-d6-session-*.txt >/dev/null 2>&1; then
            echo "Physical session files are present; confirm they are real recordings"
          else
            echo "No physical session files, as expected until rolls are recorded"
          fi
