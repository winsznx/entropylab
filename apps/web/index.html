    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EntropyLab" />
    <meta property="og:title" content="EntropyLab: measure the process before it holds your seed" />

      property="og:description"
      content="Offline profiling for physical Bitcoin entropy processes. A balanced histogram does not make a sequence unpredictable."
    />
    <meta property="og:url" content="https://entropylab.timjosh507.workers.dev/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="EntropyLab: measure the process before it holds your seed"
    />

    />
    <meta name="twitter:image" content="https://entropylab.timjosh507.workers.dev/og.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9ecf0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1216" />
    <script>
      (function () {
        try {
          var c = localStorage.getItem("entropylab:theme") || "system";
          var d =
            c === "dark" || (c === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
